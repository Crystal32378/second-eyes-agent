<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Second Eyes — local MVP (counts + coverage from file)</title>
<link rel="stylesheet" href="../workroom/styles.css">
</head>
<body>
<div class="preview-bar"><span>LOCAL MVP · 結果驅動 · STUB 來源會標示 · 與公開 workroom 分離</span></div>
<div class="page">
<h1>Local MVP</h1>
<p id="summary">載入中…（http.serve 下開啟，並把管線輸出的 JSON 存為同目錄 <code>local-mvp.json</code>）</p>
<h2>Coverage</h2>
<ul id="coverage"></ul>
<h2>Cards</h2>
<ul id="cards"></ul>
<p><small>公開站 <code>ui/workroom/</code> 維持原版，此頁只讀同目錄 local-mvp.json。</small></p>
</div>
<script>
fetch("local-mvp.json").then(r => r.json()).then(d => {
  const s = d.summary;
  document.getElementById("summary").textContent =
    `Shortlist ${s["Shortlist"]} · Needs Review ${s["Needs Review"]} · Remaining ${s["Remaining"]} · Total ${s.total}（brief: ${d.brief_id}，model calls: ${d.model_calls}）`;
  const cov = document.getElementById("coverage");
  d.coverage.slots.forEach(c => {
    const li = document.createElement("li");
    li.textContent = `${c.slot} / ${c.scene}: ${c.status}` +
      (c.members.length ? ` (${c.members.join(", ")})` : "");
    cov.appendChild(li);
  });
  const ul = document.getElementById("cards");
  d.items.forEach(it => {
    const li = document.createElement("li");
    li.innerHTML = `<strong></strong> <span></span><br><small></small><br><small class="trace"></small>`;
    li.querySelector("strong").textContent = it.asset_key + (it.stubbed ? " · STUB" : "");
    li.querySelector("span").textContent = `${it.evidence_state} / ${it.verdict} → ${it.bucket}`;
    li.querySelector("small").textContent =
      `${it.reason} · 待辦：${it.pending.join("; ") || "—"} · 解決人：${it.resolver}`;
    const refs = Object.entries(it.observed || {}).filter(([k, v]) => v)
      .map(([k, v]) => `${k}=${v.value} [${v.ref}]`).join(", ") || "—";
    const olds = Object.entries(it.old || {}).filter(([k, v]) => v)
      .map(([k, v]) => `${k}:${v}`).join(", ") || "—";
    const srcs = Object.entries(it.signal_sources || {})
      .map(([k, v]) => `${k}←${v}`).join(", ") || "—";
    li.querySelector(".trace").textContent =
      `觀察：${refs} · 舊標籤：${olds} · 訊號來源：${srcs}` +
      (it.manifest ? ` · 檔：${it.manifest.path}` : "");
    ul.appendChild(li);
  });
}).catch(() => {
  document.getElementById("summary").textContent =
    "找不到同目錄 local-mvp.json：先跑管線產生後再用 http.serve 預覽（見 docs/local-mvp.md）。";
});
</script>
</body>
</html>
