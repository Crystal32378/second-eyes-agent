name: Deploy workroom + runtime viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "ui/workroom/**"
      - "ui/runtime/**"
      - "tools/build_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Workroom keeps the existing root URL; the runtime viewer is staged
      # at /runtime/. The two live at different depths on the site than in
      # the repo, so the build rewrites the cross-links and then refuses to
      # publish if any local link fails to resolve inside the artifact.
      - name: Stage Pages artifact (workroom at root, runtime at /runtime/)
        run: python3 tools/build_pages.py --out _site --print-manifest

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
